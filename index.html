<!DOCTYPE html>
<html lang="uz" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinor Milliy Taomlar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            gold: '#FFB800',
                            goldDark: '#D48800',
                            goldLight: '#FFD54F',
                            neonBlue: '#00D2FF',
                            darkBg: '#0c0a06',
                            glassCard: 'rgba(22, 18, 12, 0.75)',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0c0a06;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(255, 184, 0, 0.22) 0%, transparent 60%),
                radial-gradient(circle at 50% 80%, rgba(0, 210, 255, 0.1) 0%, transparent 65%),
                linear-gradient(to bottom, rgba(12, 10, 6, 0.78), rgba(12, 10, 6, 0.92)),
                url('https://iili.io/Cs1Ht3J.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Glassmorphism background effect with warm golden border */
        .glass-panel {
            background: rgba(22, 18, 12, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 184, 0, 0.25);
        }

        .glass-panel-hover:hover {
            background: rgba(32, 26, 17, 0.85);
            border-color: rgba(255, 184, 0, 0.6);
            box-shadow: 0 12px 35px -5px rgba(0, 0, 0, 0.7), 0 0 25px rgba(255, 184, 0, 0.3);
        }

        /* Warm illumination glow effects */
        .glow-gold {
            box-shadow: 0 0 30px rgba(255, 184, 0, 0.4);
        }

        .glow-avatar {
            box-shadow: 0 0 40px rgba(255, 184, 0, 0.4), inset 0 0 20px rgba(255, 184, 0, 0.2);
        }

        .glow-text {
            text-shadow: 0 0 12px rgba(255, 184, 0, 0.7);
        }

        /* Custom scrollbar for menu modal */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #120e08;
        }
        ::-webkit-scrollbar-thumb {
            background: #FFB800;
            border-radius: 9999px;
        }

        /* No scrollbar utility */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="h-full text-white flex flex-col justify-between items-center min-h-screen p-4 sm:p-6 overflow-x-hidden selection:bg-amber-500 selection:text-black">

    <!-- Top Bar: Language Switcher -->
    <header class="w-full pt-2 sm:pt-4 flex justify-center items-center z-10">
        <div class="inline-flex items-center glass-panel p-1.5 rounded-full shadow-2xl shadow-amber-950/40">
            <button onclick="setLanguage('uz')" id="lang-uz" class="flex items-center gap-1.5 px-4 py-2 rounded-full text-xs sm:text-sm font-extrabold transition-all duration-300 bg-gradient-to-r from-[#FFB800] to-amber-600 text-black shadow-lg shadow-amber-500/30">
                <span class="text-[10px] bg-black/25 px-1.5 py-0.5 rounded font-black tracking-wider uppercase text-white">UZ</span> UZ
            </button>
            <button onclick="setLanguage('ru')" id="lang-ru" class="flex items-center gap-1.5 px-4 py-2 rounded-full text-xs sm:text-sm font-semibold text-gray-300 hover:text-white transition-all duration-300">
                <span class="text-[10px] bg-white/10 px-1.5 py-0.5 rounded font-black tracking-wider uppercase">RU</span> RU
            </button>
            <button onclick="setLanguage('eng')" id="lang-eng" class="flex items-center gap-1.5 px-4 py-2 rounded-full text-xs sm:text-sm font-semibold text-gray-300 hover:text-white transition-all duration-300">
                <span class="text-[10px] bg-white/10 px-1.5 py-0.5 rounded font-black tracking-wider uppercase">GB</span> ENG
            </button>
        </div>
    </header>

    <!-- Center Content Block -->
    <main class="w-full max-w-md my-auto flex flex-col items-center text-center space-y-7 z-10 py-6">
        
        <!-- Logo Container matching the warm ambient alley glow -->
        <a href="https://example.com/menu" target="_blank" class="relative group cursor-pointer">
            <!-- Soft outer background ambient glow -->
            <div class="absolute -inset-2 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-600 rounded-full blur-xl opacity-60 group-hover:opacity-90 transition duration-500 animate-pulse"></div>
            
            <div class="relative w-44 h-44 sm:w-52 sm:h-52 rounded-full border-4 border-[#FFB800] p-1 bg-[#0c0a06]/90 flex items-center justify-center glow-avatar overflow-hidden">
                <img src="https://iili.io/Cs1u8mP.jpg" alt="Chinor Logo" class="w-full h-full object-cover rounded-full shadow-inner" onerror="this.src='https://placehold.co/200x200/FFB800/000000?text=Chinor'">
            </div>
        </a>

        <!-- Title and Subtitle -->
        <div class="space-y-2.5">
            <h1 class="text-3xl sm:text-4xl font-black tracking-widest text-white uppercase drop-shadow-md">
                Old House
            </h1>
            <div class="flex items-center justify-center gap-3 text-[#FFB800]">
                <span class="h-[2px] w-8 sm:w-12 bg-gradient-to-r from-transparent to-[#FFB800]"></span>
                <p id="txt-subtitle" class="text-xs sm:text-sm font-extrabold tracking-[0.25em] uppercase text-amber-400 glow-text">
                    RESTAURANT
                </p>
                <span class="h-[2px] w-8 sm:w-12 bg-gradient-to-l from-transparent to-[#FFB800]"></span>
            </div>
        </div>

        <!-- Main Card Button direct link wrapper -->
        <a href="https://example.com/menu" target="_blank" class="w-full glass-panel glass-panel-hover rounded-2xl p-4 sm:p-4.5 flex items-center justify-between shadow-2xl cursor-pointer transform hover:-translate-y-1 transition-all duration-300 border-l-4 border-l-[#FFB800] group block">
            <div class="flex items-center gap-4">
                <!-- Hamburger Icon Box -->
                <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-[#FFB800] group-hover:bg-[#FFB800] group-hover:text-black group-hover:shadow-lg group-hover:shadow-amber-500/40 transition-all duration-300">
                    <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </div>
                <!-- Card Labels -->
                <div class="text-left">
                    <p id="txt-card-top" class="text-[10px] sm:text-xs font-bold text-amber-400/90 tracking-widest uppercase">
                        ASOSIY MENU
                    </p>
                    <h2 id="txt-card-title" class="text-base sm:text-lg font-black text-white leading-tight">
                        Taomlar ro'yxati
                    </h2>
                </div>
            </div>
            <!-- Arrow Right -->
            <div class="text-gray-400 group-hover:text-[#FFB800] group-hover:translate-x-1.5 transition-all duration-300 pr-1">
                <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
                </svg>
            </div>
        </a>

    </main>

    <!-- Footer Section -->
    <footer class="w-full text-center pb-4 pt-2 z-10 space-y-1">
        <p id="txt-footer-main" class="text-xs sm:text-sm font-bold text-gray-300 tracking-[0.2em] sm:tracking-[0.25em] uppercase">
            SIZNING SEVIMLI MASKANINGIZ
        </p>
        <p class="text-[10px] sm:text-xs font-semibold text-amber-500/80 tracking-[0.25em] uppercase">
            PREMIUM QUALITY SINCE 2024
        </p>
    </footer>

    <!-- Interactive Menu Modal -->
    <div id="menuModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 opacity-0 pointer-events-none transition-all duration-300 flex justify-center items-end sm:items-center p-0 sm:p-4">
        <div class="bg-[#120e08]/95 border border-amber-500/30 w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[88vh] flex flex-col shadow-2xl shadow-amber-950/60 overflow-hidden transform translate-y-8 transition-transform duration-300" id="modalContainer">
            
            <!-- Modal Header -->
            <div class="p-4 sm:p-5 border-b border-gray-800/80 flex items-center justify-between bg-[#18130b]/90">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-[#FFB800]/20 border border-[#FFB800] flex items-center justify-center text-[#FFB800] shadow-md shadow-amber-500/20">
                        <i class="fa-solid fa-utensils"></i>
                    </div>
                    <div>
                        <h3 id="modal-title" class="font-extrabold text-white text-lg">Taomlar Menusi</h3>
                        <p id="modal-subtitle" class="text-xs text-amber-400/80 font-medium">Chinor Milliy Taomlar</p>
                    </div>
                </div>
                <button onclick="closeMenu()" class="w-9 h-9 rounded-full bg-gray-800/80 text-gray-400 hover:text-white hover:bg-amber-600 transition-all duration-200 flex items-center justify-center">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Categories Filter -->
            <div class="px-4 py-3 border-b border-gray-800/80 flex gap-2 overflow-x-auto no-scrollbar text-xs font-semibold bg-[#0d0a05]">
                <button onclick="filterCategory('all')" class="cat-btn bg-gradient-to-r from-[#FFB800] to-amber-600 text-black font-bold px-4 py-2 rounded-full whitespace-nowrap shadow-md transition-all" data-cat="all">Barchasi</button>
                <button onclick="filterCategory('quyuq')" class="cat-btn bg-gray-800/70 text-gray-300 hover:bg-gray-700/80 px-4 py-2 rounded-full whitespace-nowrap transition-all" data-cat="quyuq">Quyuq Taomlar</button>
                <button onclick="filterCategory('suyuq')" class="cat-btn bg-gray-800/70 text-gray-300 hover:bg-gray-700/80 px-4 py-2 rounded-full whitespace-nowrap transition-all" data-cat="suyuq">Suyuq Taomlar</button>
                <button onclick="filterCategory('kabob')" class="cat-btn bg-gray-800/70 text-gray-300 hover:bg-gray-700/80 px-4 py-2 rounded-full whitespace-nowrap transition-all" data-cat="kabob">Kaboblar</button>
                <button onclick="filterCategory('ichimlik')" class="cat-btn bg-gray-800/70 text-gray-300 hover:bg-gray-700/80 px-4 py-2 rounded-full whitespace-nowrap transition-all" data-cat="ichimlik">Ichimliklar</button>
            </div>

            <!-- Food Items List -->
            <div class="p-4 overflow-y-auto space-y-3.5 flex-1" id="foodList">
                <!-- Items populated dynamically by JavaScript -->
            </div>

            <!-- Modal Footer -->
            <div class="p-4 border-t border-gray-800/80 bg-[#18130b]/90 flex items-center justify-between text-xs text-gray-300 font-medium">
                <span><i class="fa-solid fa-phone text-[#FFB800] mr-1.5"></i> +998 90 123 45 67</span>
                <span><i class="fa-solid fa-location-dot text-[#FFB800] mr-1.5"></i> Toshkent sh.</span>
            </div>
        </div>
    </div>

    <script>
        // Translations dataset
        const translations = {
            uz: {
                subtitle: "RESTAURANT",
                cardTop: "ASOSIY MENU",
                cardTitle: "Taomlar ro'yxati",
                footerMain: "SIZNING SEVIMLI MASKANINGIZ",
                modalTitle: "Taomlar Menusi",
                modalSub: "Chinor Milliy Taomlar",
                cats: {
                    all: "Barchasi",
                    quyuq: "Quyuq Taomlar",
                    suyuq: "Suyuq Taomlar",
                    kabob: "Kaboblar",
                    ichimlik: "Ichimliklar"
                }
            },
            ru: {
                subtitle: "РЕСТОРАН",
                cardTop: "ГЛАВНОЕ МЕНЮ",
                cardTitle: "Список блюд",
                footerMain: "ВАШЕ ЛЮБИМОЕ МЕСТО",
                modalTitle: "Меню Блюд",
                modalSub: "Национальные Блюда Чинор",
                cats: {
                    all: "Все",
                    quyuq: "Вторые Блюда",
                    suyuq: "Первые Блюда",
                    kabob: "Шашлыки",
                    ichimlik: "Напитки"
                }
            },
            eng: {
                subtitle: "RESTAURANT",
                cardTop: "MAIN MENU",
                cardTitle: "Food List",
                footerMain: "YOUR FAVORITE PLACE",
                modalTitle: "Food Menu",
                modalSub: "Chinor National Cuisine",
                cats: {
                    all: "All",
                    quyuq: "Main Dishes",
                    suyuq: "Soups",
                    kabob: "Kebabs",
                    ichimlik: "Drinks"
                }
            }
        };

        // Menu items dataset
        const foods = [
            {
                name: { uz: "Toshkent Palov", ru: "Ташкентский Плов", eng: "Tashkent Plov" },
                desc: { uz: "Sariq va qizil sabzi, damlangan guruch va qo'y go'shti", ru: "Желтая и красная морковь, рис и баранина", eng: "Yellow and red carrots, rice and lamb" },
                price: "45,000 so'm",
                cat: "quyuq",
                icon: "fa-bowl-rice"
            },
            {
                name: { uz: "Choyxona Palov", ru: "Чайханский Плов", eng: "Choyxona Plov" },
                desc: { uz: "To'q rangli guruch va maxsus ziravorlar bilan", ru: "С темным рисом и особыми специями", eng: "Dark rice with special traditional spices" },
                price: "48,000 so'm",
                cat: "quyuq",
                icon: "fa-bowl-rice"
            },
            {
                name: { uz: "Qozon Kabob", ru: "Казан Кебаб", eng: "Kazan Kebab" },
                desc: { uz: "Qovurilgan muloyim go'sht va oltin kartoshka", ru: "Жареное нежное мясо с картофелем", eng: "Fried tender meat with golden potatoes" },
                price: "60,000 so'm",
                cat: "quyuq",
                icon: "fa-drumstick-bite"
            },
            {
                name: { uz: "Mastava", ru: "Мастава", eng: "Mastava Soup" },
                desc: { uz: "Guruch, sabzavotlar va go'shtli quyuq sho'rva", ru: "Густой суп с рисом и мясом", eng: "Rich traditional rice and meat soup" },
                price: "32,000 so'm",
                cat: "suyuq",
                icon: "fa-utensils"
            },
            {
                name: { uz: "Sho'rva", ru: "Шурпа", eng: "Shurpa" },
                desc: { uz: "Me'yorida pishirilgan qo'y go'shti va sabzavotlar", ru: "Шурпа из баранины с овощами", eng: "Traditional lamb and vegetable broth" },
                price: "35,000 so'm",
                cat: "suyuq",
                icon: "fa-utensils"
            },
            {
                name: { uz: "Lula Kabob", ru: "Люля Кебаб", eng: "Lula Kebab" },
                desc: { uz: "Qiyma go'shtidan tayyorlangan sho'x shashlik", ru: "Шашлык из рубленого мяса", eng: "Minced meat kebab grilled on skewers" },
                price: "18,000 so'm",
                cat: "kabob",
                icon: "fa-fire"
            },
            {
                name: { uz: "Gijduvon Kabob", ru: "Гиждуванский Шашлык", eng: "Gijduvon Kebab" },
                desc: { uz: "Maxsus retsept bo'yicha tayyorlangan shirali go'sht", ru: "Сочный шашлык по особому рецепту", eng: "Juicy special recipe kebab" },
                price: "20,000 so'm",
                cat: "kabob",
                icon: "fa-fire"
            },
            {
                name: { uz: "Ko'k / Qora Choy", ru: "Зеленый / Черный Чай", eng: "Green / Black Tea" },
                desc: { uz: "Limon va rayhon bilan damlangan choynak", ru: "В чайнике с лимоном и райхоном", eng: "Teapot served with fresh herbs & lemon" },
                price: "5,000 so'm",
                cat: "ichimlik",
                icon: "fa-mug-hot"
            },
            {
                name: { uz: "Meva Sharbati", ru: "Фруктовый Сок", eng: "Fruit Juice" },
                desc: { uz: "Tabiiy meva sharbatlari (1 litr)", ru: "Натуральные фруктовые соки (1 л)", eng: "Natural fruit juice (1L)" },
                price: "18,000 so'm",
                cat: "ichimlik",
                icon: "fa-glass-water"
            }
        ];

        let currentLang = 'uz';
        let currentCategory = 'all';

        // Switch Language Function
        function setLanguage(lang) {
            currentLang = lang;
            
            // Toggle active tab buttons styling
            ['uz', 'ru', 'eng'].forEach(l => {
                const btn = document.getElementById(`lang-${l}`);
                if (l === lang) {
                    btn.className = "flex items-center gap-1.5 px-4 py-2 rounded-full text-xs sm:text-sm font-extrabold transition-all duration-300 bg-gradient-to-r from-[#FFB800] to-amber-600 text-black shadow-lg shadow-amber-500/30";
                } else {
                    btn.className = "flex items-center gap-1.5 px-4 py-2 rounded-full text-xs sm:text-sm font-semibold text-gray-300 hover:text-white transition-all duration-300";
                }
            });

            // Update DOM Texts
            document.getElementById('txt-subtitle').innerText = translations[lang].subtitle;
            document.getElementById('txt-card-top').innerText = translations[lang].cardTop;
            document.getElementById('txt-card-title').innerText = translations[lang].cardTitle;
            document.getElementById('txt-footer-main').innerText = translations[lang].footerMain;
            document.getElementById('modal-title').innerText = translations[lang].modalTitle;
            document.getElementById('modal-subtitle').innerText = translations[lang].modalSub;

            // Update Filter Button Texts
            document.querySelectorAll('.cat-btn').forEach(btn => {
                const cat = btn.getAttribute('data-cat');
                if (translations[lang].cats[cat]) {
                    btn.innerText = translations[lang].cats[cat];
                }
            });

            // Refresh Menu List
            renderFoodList();
        }

        // Render Food List inside Modal
        function renderFoodList() {
            const listContainer = document.getElementById('foodList');
            listContainer.innerHTML = '';

            const filtered = currentCategory === 'all' 
                ? foods 
                : foods.filter(item => item.cat === currentCategory);

            filtered.forEach(item => {
                const foodCard = document.createElement('div');
                foodCard.className = "bg-[#1d170e]/80 hover:bg-[#261f14] border border-gray-800/80 hover:border-amber-500/40 rounded-xl p-3.5 flex items-center justify-between transition-all duration-200 shadow-md";
                foodCard.innerHTML = `
                    <div class="flex items-center gap-3.5 pr-2">
                        <div class="w-10 h-10 rounded-lg bg-[#FFB800]/15 border border-[#FFB800]/30 flex items-center justify-center text-[#FFB800] flex-shrink-0">
                            <i class="fa-solid ${item.icon || 'fa-utensils'} text-base"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-white text-sm leading-tight">${item.name[currentLang]}</h4>
                            <p class="text-xs text-gray-400 mt-0.5 line-clamp-1">${item.desc[currentLang]}</p>
                        </div>
                    </div>
                    <div class="text-right flex-shrink-0">
                        <span class="text-xs sm:text-sm font-extrabold text-[#FFB800] bg-[#FFB800]/10 px-2.5 py-1 rounded-lg border border-[#FFB800]/30 inline-block">${item.price}</span>
                    </div>
                `;
                listContainer.appendChild(foodCard);
            });
        }

        // Category Filter Handler
        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.getAttribute('data-cat') === cat) {
                    btn.className = "cat-btn bg-gradient-to-r from-[#FFB800] to-amber-600 text-black font-bold px-4 py-2 rounded-full whitespace-nowrap shadow-md transition-all";
                } else {
                    btn.className = "cat-btn bg-gray-800/70 text-gray-300 hover:bg-gray-700/80 px-4 py-2 rounded-full whitespace-nowrap transition-all";
                }
            });
            renderFoodList();
        }

        // Open Modal
        function openMenu() {
            renderFoodList();
            const modal = document.getElementById('menuModal');
            const container = document.getElementById('modalContainer');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            container.classList.remove('translate-y-8');
        }

        // Close Modal
        function closeMenu() {
            const modal = document.getElementById('menuModal');
            const container = document.getElementById('modalContainer');
            modal.classList.add('opacity-0', 'pointer-events-none');
            container.classList.add('translate-y-8');
        }

        // Close modal when clicking backdrop
        document.getElementById('menuModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeMenu();
            }
        });

        // Initialize on load
        window.onload = function() {
            setLanguage('uz');
        };
    </script>
</body>
</html>
